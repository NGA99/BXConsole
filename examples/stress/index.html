<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>bxconsole stress target</title>
    <!--
      A blocking script above the agent, so it has finished and is sitting in
      Resource Timing by the time the agent installs. That is the case where
      the agent's own boot order decides whether the page's loading shows up
      in the Network tab at all.
    -->
    <script src="early.js"></script>
    <script src="/agent.js" data-name="stress" data-screen="record"></script>
    <style>
      body { font-family: system-ui, sans-serif; padding: 24px; }
      button { margin: 4px; padding: 6px 12px; }
      #rows div { padding: 2px 6px; border-bottom: 1px solid #eee; }
    </style>
    <script>
      /*
       * A stylesheet built the way styled-components, emotion and MUI build
       * theirs: an empty <style> filled through insertRule, with no text node
       * inside it at all. This is the shape that used to hang the Elements
       * tab, so the page carries it from the first paint.
       */
      (function () {
        var el = document.createElement('style');
        document.head.appendChild(el);
        var sheet = el.sheet;
        sheet.insertRule('.cssinjs { color: #1a73e8; font-weight: 600; }', 0);
        sheet.insertRule('.cssinjs::after { content: " (styled by insertRule)"; opacity: .6; }', 1);
      })();
    </script>
  </head>
  <body>
    <h1 class="cssinjs">Stress target</h1>
    <p>For checking that the console stays usable on something larger than the demo page.</p>
    <p id="fixtures-note" hidden>
      The two large files are generated, not kept in the repository. Run
      <code>npm run fixtures</code> and reload.
    </p>
    <div>
      <button id="rows-btn">add 5000 rows</button>
      <button id="churn-btn">churn 10s</button>
      <button id="json-btn">fetch 4000-row JSON</button>
      <button id="script-btn">load the big script</button>
      <button id="wide-btn">one very long line</button>
    </div>
    <div id="rows"></div>
    <pre id="wide"></pre>
    <script>
      document.getElementById('rows-btn').onclick = function () {
        var host = document.getElementById('rows');
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 5000; i++) {
          var d = document.createElement('div');
          d.className = 'row r' + (i % 7);
          d.setAttribute('data-index', String(i));
          d.textContent = 'row ' + i + ' — some text to give the tree something to measure';
          frag.appendChild(d);
        }
        host.appendChild(frag);
        console.log('added 5000 rows; total nodes', document.getElementsByTagName('*').length);
      };
      document.getElementById('churn-btn').onclick = function () {
        var host = document.getElementById('rows');
        var until = Date.now() + 10000;
        var t = setInterval(function () {
          if (Date.now() > until) return clearInterval(t);
          var first = host.firstElementChild;
          if (first) first.setAttribute('data-tick', String(Date.now()));
          var d = document.createElement('div');
          d.textContent = 'churn ' + Date.now();
          host.appendChild(d);
          setTimeout(function () { d.remove(); }, 40);
        }, 25);
      };
      // Both large files are generated by `npm run fixtures`. Say so plainly
      // rather than failing in a way that looks like a bug in the console.
      function needFixtures() {
        document.getElementById('fixtures-note').hidden = false;
        console.warn('big.json / big.js are missing — run `npm run fixtures`');
      }
      document.getElementById('json-btn').onclick = function () {
        fetch('big.json')
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (j) { console.log('rows', j.rows.length); })
          .catch(needFixtures);
      };
      document.getElementById('script-btn').onclick = function () {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = 'big.js';
        s.onerror = needFixtures;
        document.head.appendChild(s);
      };
      document.getElementById('wide-btn').onclick = function () {
        document.getElementById('wide').textContent = 'x'.repeat(20000);
      };
    </script>
  </body>
</html>
